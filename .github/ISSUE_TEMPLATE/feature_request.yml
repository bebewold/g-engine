name: Feature Request
description: Suggest an idea, enhancement, or architectural improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea or architectural suggestion for g-engine? We'd love to hear it!

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem or limitation is (e.g. "I'm always frustrated when [...]").
      placeholder: Describe the problem...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Enhancement
      description: A clear description of what you want to happen and how you envision the API or behavior.
      placeholder: Describe your proposed solution...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.
      placeholder: Describe alternatives...

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, code snippets, or diagrams about the feature request here.
